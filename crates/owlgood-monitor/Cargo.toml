[package]
name = "owlgood-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
owlgood-core = { path = "../owlgood-core" }
serde_json = "1"
httpdate = "1"

[target.'cfg(target_os = "macos")'.dependencies]
curl = { version = "0.4", default-features = false, features = ["force-system-lib-on-osx"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
curl = "0.4"

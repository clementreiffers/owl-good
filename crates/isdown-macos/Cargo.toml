[package]
name = "isdown-macos"
version = "0.1.0"
edition = "2024"

[dependencies]
isdown-core = { path = "../isdown-core" }
isdown-monitor = { path = "../isdown-monitor" }
serde_json = "1"
regex = "1"
curl = "0.4"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSObject", "NSString", "NSArray", "NSDictionary", "NSGeometry", "NSTimer", "NSRunLoop", "NSBundle", "NSURL", "NSError", "NSNotification", "NSAttributedString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSRunningApplication", "NSFontDescriptor", "NSApplication", "NSResponder", "NSView", "NSViewController", "NSWindow", "NSControl", "NSButton", "NSButtonCell", "NSCell", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSPopover", "NSScrollView", "NSClipView", "NSText", "NSTextView", "NSTextField", "NSFont", "NSColor", "NSImage", "NSImageView", "NSBezierPath", "NSGraphics", "NSWorkspace", "NSAppearance", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSAlert", "NSAccessibility", "NSAccessibilityProtocols", "NSLayoutManager", "NSTextContainer"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationResponse", "UNNotificationSound", "UNNotificationSettings"] }

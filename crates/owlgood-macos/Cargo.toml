[package]
name = "owlgood-macos"
version = "0.1.0"
edition = "2024"

[dependencies]
owlgood-core = { path = "../owlgood-core" }
owlgood-monitor = { path = "../owlgood-monitor" }
serde_json = "1"
regex = "1"
url = "2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
curl = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
curl = { version = "0.4", default-features = false, features = ["force-system-lib-on-osx"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDate", "NSDateFormatter", "NSTimeZone", "NSObject", "NSString", "NSArray", "NSDictionary", "NSGeometry", "NSTimer", "NSRunLoop", "NSBundle", "NSURL", "NSError", "NSNotification", "NSAttributedString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSRunningApplication", "NSFontDescriptor", "NSApplication", "NSResponder", "NSView", "NSViewController", "NSWindow", "NSControl", "NSButton", "NSSwitch", "NSButtonCell", "NSCell", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSPopover", "NSScrollView", "NSClipView", "NSText", "NSTextView", "NSTextField", "NSTextFieldCell", "NSFont", "NSColor", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSColorSpace", "NSImageView", "NSBezierPath", "NSGraphics", "NSWorkspace", "NSAppearance", "NSPopUpButton", "NSMenu", "NSParagraphStyle", "NSAttributedString", "NSBox", "NSGlassEffectView", "NSVisualEffectView", "NSTabView", "NSTabViewItem", "NSMenuItem", "NSAlert", "NSAccessibility", "NSAccessibilityProtocols", "NSLayoutManager", "NSTextContainer"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationResponse", "UNNotificationSound", "UNNotificationSettings"] }

[package]
name = "isdown"
version = "0.1.0"
edition = "2024"

[dependencies]
isdown-core = { path = "crates/isdown-core" }
isdown-monitor = { path = "crates/isdown-monitor" }
isdown-macos = { path = "crates/isdown-macos" }

[workspace]
members = ["crates/*"]
resolver = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[package]
name = "owlgood"
version = "0.1.0"
edition = "2024"

[dependencies]
owlgood-core = { path = "crates/owlgood-core" }
owlgood-monitor = { path = "crates/owlgood-monitor" }
owlgood-macos = { path = "crates/owlgood-macos" }

[workspace]
members = ["crates/*"]
resolver = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
